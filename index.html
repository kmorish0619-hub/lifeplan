<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>かざみ ライフプラン試算</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf8f5;--tx:#4a3730;--sub:#8a7a72;--ln:#e6dfd8;--card:#fff;--c1:#8e96c4;--c2:#c08ca0;--c3:#4a3730;--bad:#a23b3b;--hl:#f3e4e4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1a18;--tx:#efe6e0;--sub:#b3a39b;--ln:#3a322e;--card:#2a2320;--c3:#d9c6bb;--hl:#3b2a2d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1f1a18;--tx:#efe6e0;--sub:#b3a39b;--ln:#3a322e;--card:#2a2320;--c3:#d9c6bb;--hl:#3b2a2d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);padding-bottom:calc(128px + env(safe-area-inset-bottom,0px));max-width:720px;margin-inline:auto;line-height:1.6}
header{display:flex;align-items:center;gap:8px;padding:14px 20px;border-bottom:1px solid var(--ln);font-size:26px;font-weight:700;color:#7a4040}
@media(prefers-color-scheme:dark){header{color:#e0b4b4}}
header small{font-size:12px;color:var(--sub);font-weight:400;margin-left:auto}
main{padding:0 20px}section[hidden]{display:none}
h2{font-size:22px;margin:22px 0 4px}h3{font-size:16px;margin:26px 0 6px}
.sub{color:var(--sub);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 0;border-bottom:1px solid var(--ln)}
.big{font-size:34px;font-weight:500;letter-spacing:-.01em}.big small,.row b small{font-size:13px;color:var(--sub);margin-left:3px;font-weight:400}
.wx{display:flex;align-items:center;gap:12px;margin:8px 0}.wx .ic{font-size:44px}.wx .nm{font-size:30px;font-weight:700}.wx .sc{margin-left:auto;text-align:right;border-left:1px solid var(--ln);padding-left:16px;font-size:12px;color:var(--sub)}.wx .sc b{display:block;font-size:34px;color:var(--tx);font-weight:500;line-height:1.1}
.chart{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:10px 6px 6px;margin:10px 0}
.chart svg{width:100%;height:auto;display:block;touch-action:pan-y}
.legend{display:flex;gap:14px;font-size:12px;color:var(--sub);padding:0 8px}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.tip{min-height:42px;font-size:13px;padding:6px 8px;color:var(--tx)}
.bar{height:10px;border-radius:5px;margin:6px 0}
.peak{display:flex;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--ln);cursor:pointer;width:100%;background:none;border-inline:0;border-top:0;color:inherit;font:inherit;text-align:left}
.peak .y{font-size:26px;color:var(--c1);min-width:62px}.peak .y small{display:block;font-size:11px;color:var(--sub)}
.tbl{overflow-x:auto;border:1px solid var(--ln);border-radius:10px;background:var(--card);margin:10px 0}
table{border-collapse:separate;border-spacing:0;font-size:13px;white-space:nowrap}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--ln)}
th:first-child,td:first-child{position:sticky;left:0;background:var(--card);text-align:left;font-weight:500;z-index:1;border-right:1px solid var(--ln)}
tr.g td{background:var(--bg);font-weight:700;color:var(--sub)}tr.t td{font-weight:700}
.neg{color:var(--bad)}th.p65{color:var(--c1)}th.pk,td.pk{background:var(--hl)}
.seg{display:flex;background:var(--card);border:1px solid var(--ln);border-radius:22px;padding:3px;margin:14px 0}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:19px;font:inherit;color:var(--sub)}.seg .on{background:var(--bg);color:var(--tx);box-shadow:0 0 0 1px var(--ln)}
.f{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--ln)}
.f label{font-size:14px}.f span{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
.f input{width:92px;font:inherit;font-size:16px;text-align:right;padding:8px 10px;border:1px solid var(--ln);border-radius:8px;background:var(--card);color:var(--tx)}
:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
button.reset{margin:24px 0;padding:10px 16px;border:1px solid var(--ln);border-radius:8px;background:none;color:var(--sub);font:inherit}
.foot{position:fixed;left:0;right:0;bottom:0;max-width:720px;margin-inline:auto;background:var(--bg);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
.mini{display:flex;align-items:center;gap:12px;padding:8px 20px;border-bottom:1px solid var(--ln);font-size:13px}.mini b{font-size:24px;font-weight:500}.mini .r{margin-left:auto;text-align:right;color:var(--sub);font-size:11px}.mini .r b{display:block;font-size:17px;color:var(--tx)}
nav{display:flex}nav button{flex:1;border:0;background:none;padding:10px 0 12px;font:inherit;font-size:12px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}nav button span{font-size:20px}nav .on{color:var(--tx);font-weight:700}
.note{font-size:12px;color:var(--sub);margin:18px 0}
</style></head><body>
<header>🐓 かざみ<small>2026年11月の制度ベース・概算</small></header>
<main>
<section id="home"></section>
<section id="view" hidden></section>
<section id="house" hidden></section>
<section id="me" hidden></section>
<p class="note">金額は万円単位の概算です。税・社会保険料・教育費は簡易モデルで、実際の制度とは差があります。重要な判断は専門家へご相談ください。</p>
</main>
<div class="foot"><div class="mini"><span id="mi-ic"></span><span id="mi-nm"></span><b id="mi-sc"></b>点<div class="r">65歳時の資産<b id="mi-a"></b></div></div>
<nav id="nav"></nav></div>
<script>
const DEF={a1:30,a2:27,i1:680,i2:100,r1:65,r2:60,pen1:238,pen2:85,live:32.5,loan:10,loanBal:3200,other:50,cash:50,inv:2500,add:0,ret:3,infl:2,child:0};
const FIELDS={
 me:[["収入",[["a1","こうきの年齢","歳"],["a2","パートナーの年齢","歳"],["i1","こうきの年収","万円"],["i2","パートナーの年収","万円"],["r1","こうきの退職年齢","歳"],["r2","パートナーの退職年齢","歳"]]],
  ["生活費・家族",[["live","生活費（月）","万円"],["child","子どもの年齢（0歳）","歳"]]],
  ["資産・年金",[["cash","預金","万円"],["inv","資産運用の残高","万円"],["add","運用の積立（月）","万円"],["pen1","こうきの年金（年）","万円"],["pen2","パートナーの年金（年）","万円"]]],
  ["前提",[["ret","運用利回り（年）","%"],["infl","生活費の上昇率（年）","%"]]]],
 house:[["持ち家のローン",[["loan","月々の返済","万円"],["loanBal","ローン残高","万円"],["other","税・保険・管理費（年）","万円"]]]]};
let p;try{p={...DEF,...JSON.parse(localStorage.getItem("kazami")||"{}")}}catch(e){p={...DEF}}
const n=x=>Math.round(x).toLocaleString("ja-JP"),$=id=>document.getElementById(id);
const EDU=a=>a<3?0:a<6?15:a<12?13:a<15?27:a<18?50:a<22?103:0;
function sim(){let cash=p.cash,inv=p.inv,left=p.loanBal,R=[];
 for(let i=0;i<=80;i++){const a=p.a1+i,b=p.a2+i,f=Math.pow(1+p.infl/100,i),c=p.child+i;
  const s1=a<p.r1?p.i1+15*Math.max(0,Math.min(i,60-p.a1)):0,s2=b<p.r2?p.i2:0,pn=(a>=65?p.pen1:0)+(b>=65?p.pen2:0),al=c<3?18:c<=18?12:0;
  const live=p.live*12*f,pay=Math.min(left,p.loan*12);left-=pay;const house=pay+p.other,edu=EDU(c),w=s1+s2;
  const tax=w*.068+pn*.02,soc=w*.13+pn*.09,inc=w+pn+al,exp=live+house+edu+tax+soc,bal=inc-exp;
  inv=inv*(1+p.ret/100)+p.add*12;cash+=bal-p.add*12;
  R.push({a,y:2026+i,s1,s2,pn,al,live,house,edu,ts:tax+soc,inc,exp,bal,cash,inv,tot:cash+inv,c})}
 return R}
let R,PK=[];
function analyze(){R=sim();const w=R.filter(r=>r.a<65).sort((x,y)=>x.bal-y.bal).slice(0,2).filter((r,i)=>i==0||r.bal<0);
 PK=w.sort((x,y)=>x.a-y.a);const min=Math.min(...R.filter(r=>r.a<=95).map(r=>r.tot)),a65=(R.find(r=>r.a==65)||R[R.length-1]).tot;
 let sc=min<0?Math.max(10,Math.round(45+min/400)):Math.min(100,Math.round(60+a65/250));sc=Math.max(5,Math.min(100,sc));
 return{sc,a65,ic:sc>=90?"☀️":sc>=70?"⛅":sc>=50?"☁️":"🌧️",nm:sc>=90?"晴れ":sc>=70?"晴れ時々くもり":sc>=50?"くもり":"雨",min}}
function line(pts){return pts.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join("")}
function areaChart(id){const D=R.filter(r=>r.a<=75),W=360,H=220,L=44,T=10,B=24,mx=Math.max(...D.map(r=>r.tot),1000),mn=Math.min(0,...D.map(r=>r.tot)),
 X=i=>L+i*(W-L-8)/(D.length-1),Y=v=>T+(mx-v)*(H-T-B)/(mx-mn);
 const tk=[];const st=mx>40000?20000:mx>16000?10000:5000;for(let v=Math.ceil(mn/st)*st;v<=mx;v+=st)tk.push(v);
 const fmt=v=>v==0?"0":Math.abs(v)>=10000?(v/10000)+"億":v.toLocaleString();
 const base=Y(0);return `<svg viewBox="0 0 ${W} ${H}" data-c="${id}">${tk.map(v=>`<line x1="${L}" x2="${W-8}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--ln)" stroke-dasharray="3 3"/><text x="${L-5}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="var(--sub)">${fmt(v)}</text>`).join("")}
 <path d="${line(D.map((r,i)=>[X(i),Y(r.tot)]))}L${X(D.length-1)} ${base}L${X(0)} ${base}Z" fill="var(--c1)" opacity=".18"/>
 <path d="${line(D.map((r,i)=>[X(i),Y(r.inv)]))}" fill="none" stroke="var(--c3)" stroke-width="2"/>
 <path d="${line(D.map((r,i)=>[X(i),Y(r.tot)]))}" fill="none" stroke="var(--c2)" stroke-width="2"/>
 ${[30,40,50,60,70].filter(a=>a>=D[0].a).map(a=>`<text x="${X(a-D[0].a)}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--sub)">${a}歳</text>`).join("")}
 <line class="cur" y1="${T}" y2="${H-B}" stroke="var(--sub)" opacity="0"/></svg>`}
function cfChart(id){const D=R.filter(r=>r.a<=75),W=360,H=220,L=44,T=10,B=24,mx=Math.max(...D.map(r=>r.inc),100)*1.1,mn=-Math.max(...D.map(r=>r.exp),100)*1.1,
 X=i=>L+(i+.5)*(W-L-8)/D.length,Y=v=>T+(mx-v)*(H-T-B)/(mx-mn),bw=(W-L-8)/D.length*.55;
 return `<svg viewBox="0 0 ${W} ${H}" data-c="${id}"><line x1="${L}" x2="${W-8}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--ln)"/>
 ${[mx*.9,mn*.9].map(v=>`<text x="${L-5}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="var(--sub)">${n(v)}</text>`).join("")}
 ${D.map((r,i)=>`<rect x="${X(i)-bw/2}" y="${Y(r.inc)}" width="${bw}" height="${Y(0)-Y(r.inc)}" fill="var(--c1)" opacity=".6"/><rect x="${X(i)-bw/2}" y="${Y(0)}" width="${bw}" height="${Y(r.exp*-1)-Y(0)}" fill="var(--c2)" opacity=".6"/>`).join("")}
 <path d="${line(D.map((r,i)=>[X(i),Y(r.bal)]))}" fill="none" stroke="var(--c3)" stroke-width="2"/>
 ${[30,40,50,60,70].filter(a=>a>=D[0].a).map(a=>`<text x="${X(a-D[0].a)}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--sub)">${a}歳</text>`).join("")}</svg>`}
function renderHome(){const A=analyze(),r0=R[0],h=R.find(r=>r.a==65)||R[0];
 $("home").innerHTML=`<p class="sub" style="margin:14px 0 0">こうきさん${p.a1}歳・パートナーさん${p.a2}歳のプラン</p>
 <p class="sub" style="margin:14px 0 0">いまの家計の天気</p><div class="wx"><span class="ic">${A.ic}</span><span class="nm">${A.nm}</span><div class="sc"><b>${A.sc}</b>点 / 100</div></div>
 <p class="sub">${A.min<0?"このままだと資産がマイナスになる年が出てきます。前提を見直してみましょう。":"現時点の前提では、おおむね安定して推移する見込みです。"}</p>
 <h3>資産の見通し</h3><div class="legend"><span><i style="background:var(--c2)"></i>金融資産合計</span><span><i style="background:var(--c3)"></i>資産運用</span></div>
 <div class="chart">${areaChart("a1")}<div class="tip" id="tip-a1">グラフをなぞると年ごとの残高が見られます</div></div>
 <div class="row"><span>今年の年間収支<br><span class="sub">収入と支出の差</span></span><b class="big ${r0.bal<0?"neg":""}">${r0.bal>=0?"+":""}${n(r0.bal)}<small>万円</small></b></div>
 <div class="row"><span>今年末の総資産<br><span class="sub">預金・運用の合計</span></span><b class="big">${n(r0.tot)}<small>万円</small></b></div>
 <div class="row"><span>こうきさんが65歳の総資産<br><span class="sub">いまの前提を続けた場合</span></span><b class="big">${n(h.tot)}<small>万円</small></b></div>
 <h2>同年代との資産比較</h2><p class="sub">今年末の概算</p>
 <div class="row" style="border:0"><span>わが家の金融資産</span><b>${n(r0.tot)}万円</b></div><div class="bar" style="background:var(--c3);width:100%"></div>
 <div class="row" style="border:0"><span>30代・二人以上世帯 中央値</span><b>180万円</b></div><div class="bar" style="background:var(--c1);width:${Math.max(3,Math.min(100,180/Math.max(r0.tot,180)*100))}%"></div>
 <p class="sub">中央値は参考値です。最新の統計で更新してください。</p>
 <h2>これからの山場</h2>${PK.map(r=>`<button class="peak" data-go="${r.a}"><span class="y">${r.y}<small>${p.a1==r.a?"":""}こうき${r.a}歳</small></span><span><b>${r.c==18?"子どもの大学入学":"支出が重なる年"}</b><br><span class="sub">${r.c==18?"教育費とローン返済が重なります":"年間収支 "}${r.c==18?"":(r.bal>=0?"+":"")+n(r.bal)+"万円"}</span></span></button>`).join("")||'<p class="sub">いまのところ目立つ山場はありません。</p>'}`;
 $("mi-ic").textContent=A.ic;$("mi-nm").textContent=A.nm;$("mi-sc").textContent=A.sc;$("mi-a").textContent=n(A.a65)+"万円";
 wire("a1",areaChart)}
function wire(id,_){const s=document.querySelector(`[data-c="${id}"]`),t=$("tip-"+id);if(!s||!t)return;const D=R.filter(r=>r.a<=75);
 const mv=e=>{const b=s.getBoundingClientRect(),x=((e.clientX-b.left)/b.width*360-44)/(360-52),i=Math.max(0,Math.min(D.length-1,Math.round(x*(D.length-1)))),r=D[i];
 t.innerHTML=id=="a1"?`<b>${r.a}歳</b>　運用 ${n(r.inv)}万円・預金 ${n(r.cash)}万円　合計 <b>${n(r.tot)}万円</b>`:`<b>${r.a}歳</b>　収入 ${n(r.inc)}・支出 ${n(r.exp)}　収支 <b class="${r.bal<0?"neg":""}">${n(r.bal)}万円</b>`};
 s.addEventListener("pointermove",mv);s.addEventListener("pointerdown",mv)}
let mode="t";
function renderView(){const pk=new Set(PK.map(r=>r.a)),rows=[["収入"],["こうき 給与","s1"],["パートナー 給与","s2"],["年金","pn"],["児童手当","al"],["支出"],["生活費","live"],["住宅費","house"],["教育費","edu"],["税・社会保険料","ts"],["資産残高"],["預金","cash"],["資産運用","inv"],["金融資産合計","tot","t"],["年次収支","bal","t"]];
 const f=v=>v==0?"—":n(v);
 $("view").innerHTML=`<h2>将来の収支と資産</h2><p class="sub">入力した条件に基づく、年ごとの試算です。</p>
 <div class="seg"><button data-m="t" class="${mode=="t"?"on":""}">収支・資産表</button><button data-m="g" class="${mode=="g"?"on":""}">グラフ</button></div>
 ${mode=="t"?`<div class="tbl"><table><tr><th>項目＼年齢</th>${R.map(r=>`<th class="${r.a==65?"p65":""} ${pk.has(r.a)?"pk":""}">${r.a}歳<br><span class="sub">'${String(r.y).slice(2)}</span></th>`).join("")}</tr>
 ${rows.map(([l,k,c])=>k?`<tr class="${c||""}"><td>${l}</td>${R.map(r=>`<td class="${r[k]<0?"neg":""} ${pk.has(r.a)?"pk":""}">${f(r[k])}</td>`).join("")}</tr>`:`<tr class="g"><td colspan="${R.length+1}">${l}</td></tr>`).join("")}</table></div><p class="sub">単位：万円　青＝65歳、赤背景＝山場の年</p>`
 :`<h3>金融資産残高推移</h3><div class="chart">${areaChart("a2")}<div class="tip" id="tip-a2"></div></div><h3>年度別現金収支</h3><div class="legend"><span><i style="background:var(--c1)"></i>収入</span><span><i style="background:var(--c2)"></i>支出</span><span><i style="background:var(--c3)"></i>収支</span></div><div class="chart">${cfChart("c1")}<div class="tip" id="tip-c1"></div></div>`}`;
 if(mode=="g"){wire("a2");wire("c1")}
 $("view").querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{mode=b.dataset.m;renderView()})}
function form(id,title,sub){$(id).innerHTML=`<h2>${title}</h2><p class="sub">${sub}</p>`+FIELDS[id].map(([h,fs])=>`<h3>${h}</h3>`+fs.map(([k,l,u])=>`<div class="f"><label for="f-${k}">${l}</label><span><input id="f-${k}" type="number" inputmode="decimal" step="any" value="${p[k]}" data-k="${k}">${u}</span></div>`).join("")).join("")
 +(id=="house"?'<div id="hs"></div>':"")+(id=="me"?'<button class="reset" id="rs">初期値に戻す</button>':"");
 $(id).querySelectorAll("input").forEach(i=>i.oninput=()=>{const v=parseFloat(i.value);if(isNaN(v))return;p[i.dataset.k]=v;try{localStorage.setItem("kazami",JSON.stringify(p))}catch(e){}update()})}
function houseSum(){const y=Math.ceil(p.loanBal/Math.max(.1,p.loan*12));$("hs").innerHTML=`<div class="row"><span>完済までの目安</span><b>${y}年（こうき${p.a1+y}歳）</b></div><div class="row"><span>年間の住居費（返済＋税・管理費）</span><b>${n(p.loan*12+p.other)}万円</b></div><p class="sub">ローン金利は含めず、残高÷返済額で簡易計算しています。</p>`}
function update(){renderHome();renderView();if($("hs"))houseSum()}
const TABS=[["home","ホーム","🏠"],["view","見通し","📈"],["house","住宅計画","🏡"],["me","わたしたち","👪"]];
$("nav").innerHTML=TABS.map(([k,l,i])=>`<button data-t="${k}"><span>${i}</span>${l}</button>`).join("");
function show(k){TABS.forEach(([t])=>$(t).hidden=t!=k);$("nav").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.t==k));scrollTo(0,0);try{history.replaceState(null,"","#"+k)}catch(e){}}
$("nav").onclick=e=>{const b=e.target.closest("button");if(b)show(b.dataset.t)};
$("home").onclick=e=>{if(e.target.closest("[data-go]")){mode="t";renderView();show("view")}};
